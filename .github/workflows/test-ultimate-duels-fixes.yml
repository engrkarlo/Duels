name: Build UltimateDuels 26.2 fixes

on:
  push:
    branches:
      - fix/ultimate-duels-7.2.0-paper-26.2
      - fix/artifact-40-bugs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for original JAR
        run: |
          test -f vendor/UltimateDuels-7.2.0.jar
          echo 'Original UltimateDuels JAR found.'

      - name: Apply source fixes
        run: python3 -u scripts/apply_source_fixes.py

      - name: Repair patch sources for Paper 26.2
        run: python3 -u scripts/repair_patch_sources.py

      - name: Apply artifact 40 source patches
        run: python3 -u scripts/apply_artifact40_source_patches.py

      - name: Validate patch sources
        run: |
          test -f com/ultimateduels/listeners/CommandBlockListener.java
          test -f com/ultimateduels/listeners/Artifact40BugFixListener.java
          grep -q 'implements Listener' com/ultimateduels/listeners/CommandBlockListener.java
          grep -q 'Artifact40BugFixListener' com/ultimateduels/listeners/ListenerManager.java
          grep -q 'boolean isInLobbyWorld(Player player)' com/ultimateduels/lobby/LobbyManager.java
          grep -q 'getTextDisplayEntityType(entityTypeClass)' com/ultimateduels/visuals/HealthPacketSender.java
          grep -q 'saveLobbyState' com/ultimateduels/player/PlayerStateManager.java
          grep -q 'restoreLobbyState' com/ultimateduels/listeners/LobbyListener.java
          echo 'Patch sources validated.'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Compile and overlay test JAR
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify test JAR
        run: |
          JAR="build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/UltimateDuels.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/listeners/CommandBlockListener.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/listeners/Artifact40BugFixListener.class$'
          echo "Built artifact: $JAR"
          sha256sum "$JAR"
          ls -lh "$JAR"

      - name: Upload test JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDuels-7.2.0-26.2-Fixes-artifact40
          path: build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar
          if-no-files-found: error
          retention-days: 14
