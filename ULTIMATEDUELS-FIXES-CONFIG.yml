# Merge these keys into UltimateDuels/config.yml
# This file intentionally contains no database credentials or other secrets.

# FFA death item behavior
ffa:
  death-items-drop: false

# World-specific command blocking. Commands are checked by their root label,
# including commands registered by other plugins. Blacklisted worlds are ignored.
command-blocking:
  enabled: false
  worlds:
    - lobby
  commands:
    - pl
    - plugins
    - bukkit:plugins
    - version
    - ver
    - help
    - spawn
    - home
    - homes
    - fly
    - tpa
    - tpaccept
    - tpadeny
    - tp
    - pwarp
  message: '&cYou cannot use that command in this world.'

# State-specific command blocking. This is separate from command-blocking:
# these commands are blocked only while the player is queued, in a duel,
# in FFA, or spectating. The normal lobby is unaffected.
state-command-blocking:
  enabled: true
  message: '&cYou cannot use that command while you are in a match or queue.'
  queue:
    enabled: true
    commands:
      - spawn
  duel:
    enabled: true
    commands:
      - spawn
  ffa:
    enabled: true
    commands:
      - spawn
  spectating:
    enabled: true
    commands:
      - spawn

# FFA combat logging message and display location.
# Supported display values: action-bar, chat, both, none
combat-log:
  message: '&cYou are in combat for &e{time}s&c!'
  display: action-bar
