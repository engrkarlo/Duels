name: Test UltimateDuels 26.2 fixes

on:
  push:
    branches: [fix/ultimate-duels-7.2.0-paper-26.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Apply Paper 26.2 UltimateDuels fixes [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: |
          python3 -u scripts/apply_source_fixes.py

      - name: Apply patch repairs
        run: python3 -u scripts/repair_patch_sources.py

      - name: Apply runtime bugfixes
        run: python3 -u scripts/apply_runtime_bugfixes.py

      - name: Apply follow-up fixes
        run: python3 -u scripts/apply_followup_fixes_v2.py

      - name: Apply match/command/item fixes
        run: python3 -u scripts/apply_match_command_item_fixes_v3.py

      - name: Apply final match repairs
        run: python3 -u scripts/repair_final_match_fixes.py

      - name: Apply final bugfixes
        run: python3 -u scripts/apply_final_bugfixes_v7.py

      - name: Validate source fixes
        run: |
          test -f com/ultimateduels/listeners/CommandBlockListener.java
          grep -q 'new CommandBlockListener(this.plugin)' com/ultimateduels/listeners/ListenerManager.java
          grep -q 'getTextDisplayEntityType(entityTypeClass)' com/ultimateduels/visuals/HealthPacketSender.java
          grep -q 'saveLobbyState' com/ultimateduels/player/PlayerStateManager.java
          grep -q 'restoreLobbyState' com/ultimateduels/listeners/LobbyListener.java
          grep -q 'shouldDropItemsOnDeath' com/ultimateduels/listeners/PlayerDeathListener.java
          grep -q 'combatLogMessage' com/ultimateduels/ffa/FFAManager.java
          grep -q 'TELEPORT_COMMANDS' com/ultimateduels/listeners/CommandBlockListener.java
          grep -q 'isInQueue(uuid)' com/ultimateduels/listeners/CommandBlockListener.java
          grep -q 'isInMatch(uuid)' com/ultimateduels/listeners/CommandBlockListener.java
          echo 'Required source fixes are present.'

      - name: Validate Java source structure
        run: |
          python3 - <<'PY'
          import pathlib
          files = [
            'com/ultimateduels/listeners/CommandBlockListener.java',
            'com/ultimateduels/listeners/ListenerManager.java',
            'com/ultimateduels/listeners/BlockProtectionListener.java',
            'com/ultimateduels/visuals/HealthPacketSender.java',
            'com/ultimateduels/player/PlayerStateManager.java',
            'com/ultimateduels/lobby/LobbyManager.java',
            'com/ultimateduels/listeners/LobbyListener.java',
            'com/ultimateduels/listeners/WorldChangeListener.java',
            'com/ultimateduels/commands/LobbyCommand.java',
            'com/ultimateduels/ffa/FFAManager.java',
          ]
          for f in files:
              text = pathlib.Path(f).read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced braces: {f}')
          print('Java source structure validation passed.')
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Compile and package
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify teleport-lock artifact
        run: |
          JAR="build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/UltimateDuels.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/listeners/CommandBlockListener.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/listeners/WorldChangeListener.class$'
          echo "SHA-256:"
          sha256sum "$JAR"
          ls -lh "$JAR"

      - name: Upload teleport-lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDuels-7.2.0-26.2-Teleport-Lock
          path: build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar
          if-no-files-found: error
          retention-days: 14

# artifact trigger after vendor restore
