name: Build UltimateDuels 26.2 fixes

on:
  push:
    branches: [fix/ultimate-duels-7.2.0-paper-26.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 -u scripts/apply_source_fixes.py

      - name: Repair CFR output
        run: python3 -u scripts/repair_decompiler_output.py

      - name: Validate required fixes
        run: |
          test -f com/ultimateduels/listeners/CommandBlockListener.java
          grep -q 'new CommandBlockListener(this.plugin)' com/ultimateduels/listeners/ListenerManager.java
          grep -q 'getTextDisplayEntityType(entityTypeClass)' com/ultimateduels/visuals/HealthPacketSender.java
          grep -q 'saveLobbyState' com/ultimateduels/player/PlayerStateManager.java
          grep -q 'restoreLobbyState' com/ultimateduels/listeners/LobbyListener.java
          grep -q 'combatLogMessage' com/ultimateduels/ffa/FFAManager.java
          ! grep -q '\*\* GOTO' com/ultimateduels/database/DatabaseManager.java
          ! grep -q 'catch (Throwable throwable)' com/ultimateduels/database/DatabaseManager.java || true
          echo 'Required source fixes are present.'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Compile and package shaded plugin
        run: gradle clean shadowJar --no-daemon --stacktrace

      - name: Verify JAR contents
        run: |
          JAR="build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/UltimateDuels.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/listeners/CommandBlockListener.class$'
          echo "Built artifact: $JAR"
          ls -lh "$JAR"

      - name: Upload test JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDuels-7.2.0-26.2-Fixes
          path: build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar
          if-no-files-found: error
          retention-days: 14

      - name: Commit source repairs made by the build scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Repair CFR output for Paper 26.2 build [skip ci]"
          git push origin HEAD:fix/ultimate-duels-7.2.0-paper-26.2
