plugins {
    id 'java'
}

group = 'com.ultimateduels'
version = '7.2.0-26.2-Fixes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
    maven { url = uri('https://maven.enginehub.org/repo/') }
    maven { url = uri('https://mvn.intellectualsites.com/content/repositories/snapshots/') }
}

def baseJar = file('vendor/UltimateDuels-7.2.0.jar')
if (!baseJar.exists()) {
    throw new GradleException('Missing vendor/UltimateDuels-7.2.0.jar. Upload the original 7.2.0 JAR to vendor/ before building.')
}

sourceSets {
    main {
        java {
            setSrcDirs([])
            source(
                'com/ultimateduels/UltimateDuels.java',
                'com/ultimateduels/listeners/BlockProtectionListener.java',
                'com/ultimateduels/listeners/CommandBlockListener.java',
                'com/ultimateduels/listeners/ListenerManager.java',
                'com/ultimateduels/listeners/LobbyListener.java',
                'com/ultimateduels/listeners/WorldChangeListener.java',
                'com/ultimateduels/visuals/HealthPacketSender.java',
                'com/ultimateduels/player/PlayerStateManager.java',
                'com/ultimateduels/lobby/LobbyManager.java',
                'com/ultimateduels/commands/LobbyCommand.java',
                'com/ultimateduels/ffa/FFAManager.java'
            )
        }
        resources.setSrcDirs([])
    }
}

dependencies {
    compileOnly files(baseJar)
    compileOnly 'io.papermc.paper:paper-api:26.2.build.123-stable'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.3.0'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.9.2'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.9.2'
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.register('preparePatchJar', Exec) {
    commandLine 'python3', 'scripts/prepare_patch_jar.py'
}

tasks.named('compileJava') {
    dependsOn tasks.named('preparePatchJar')
}

tasks.register('overlayJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveBaseName.set('UltimateDuels')
    archiveVersion.set('7.2.0-26.2-Fixes')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('base'))
    from(sourceSets.main.output)
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn tasks.named('overlayJar')
}
