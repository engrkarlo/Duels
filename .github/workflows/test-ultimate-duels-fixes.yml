name: Test UltimateDuels 26.2 fixes

on:
  push:
    branches: [fix/ultimate-duels-7.2.0-paper-26.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Apply Paper 26.2 UltimateDuels fixes [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Apply source fixes
        run: |
          set +e
          python3 -u scripts/apply_26_2_fixes.py > apply-output.txt 2>&1
          status=$?
          cat apply-output.txt
          if [ "$status" -ne 0 ]; then
            cp apply-output.txt CI_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CI_FAILURE.txt
            git commit -m "Record fix CI failure [skip ci]"
            git push origin HEAD:fix/ultimate-duels-7.2.0-paper-26.2
            exit "$status"
          fi

      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import yaml
          for name in ['config.yml', 'plugin.yml']:
              with open(name, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('YAML OK:', name)
          PY

      - name: Validate required fixes
        run: |
          grep -q "api-version: '26.2'" plugin.yml
          grep -q 'aliases: \[ds, hub, leave, duellobby, l\]' plugin.yml
          grep -q 'death-items-drop: false' config.yml
          grep -q 'command-blocking:' config.yml
          grep -q 'combat-log:' config.yml
          grep -q 'new CommandBlockListener(this.plugin)' com/ultimateduels/listeners/ListenerManager.java
          grep -q 'getTextDisplayEntityType(entityTypeClass)' com/ultimateduels/visuals/HealthPacketSender.java
          grep -q 'saveLobbyState' com/ultimateduels/player/PlayerStateManager.java
          echo 'Required source fixes are present.'

      - name: Commit applied source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Apply Paper 26.2 UltimateDuels fixes [skip ci]"
          git push origin HEAD:fix/ultimate-duels-7.2.0-paper-26.2
