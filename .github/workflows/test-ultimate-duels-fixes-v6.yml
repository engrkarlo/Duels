name: Build UltimateDuels final bugfix v6

on:
  push:
    branches: [fix/ultimate-duels-7.2.0-paper-26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check original JAR
        run: test -f vendor/UltimateDuels-7.2.0.jar
      - name: Apply source fixes
        run: python3 -u scripts/apply_source_fixes.py
      - name: Repair Paper 26.2 sources
        run: python3 -u scripts/repair_patch_sources.py
      - name: Apply runtime bugfixes
        run: python3 -u scripts/apply_runtime_bugfixes.py
      - name: Apply follow-up runtime fixes
        run: python3 -u scripts/apply_followup_fixes_v2.py
      - name: Apply final command and match fixes
        run: python3 -u scripts/apply_match_command_item_fixes_v3.py
      - name: Repair final match fixes
        run: python3 -u scripts/repair_final_match_fixes.py
      - name: Apply final bugfixes v6
        run: python3 -u scripts/apply_final_bugfixes_v6.py
      - name: Validate final sources
        run: |
          grep -q 'this.reloadConfig();' com/ultimateduels/UltimateDuels.java
          grep -q 'Do not teleport players during shutdown' com/ultimateduels/UltimateDuels.java
          grep -q 'Normal-world players are never reset' com/ultimateduels/listeners/PlayerJoinQuitListener.java
          grep -q 'message-at-seconds' scripts/prepare_patch_jar.py
          grep -q 'never one timer per item' com/ultimateduels/ffa/DroppedItemClearManager.java
          grep -q 'startDuelMatch(match)' com/ultimateduels/duel/DuelManager.java
          grep -q 'startFFAMatch(arenaName, arena.getArena())' com/ultimateduels/ffa/FFAManager.java
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Compile and overlay
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify JAR
        run: |
          JAR="build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/UltimateDuels.class$'
          jar tf "$JAR" | grep -q '^com/ultimateduels/ffa/DroppedItemClearManager.class$'
          unzip -p "$JAR" config.yml | grep -q 'message-at-seconds: 3'
          sha256sum "$JAR"
          ls -lh "$JAR"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDuels-7.2.0-26.2-Fixes-v6
          path: build/libs/UltimateDuels-7.2.0-26.2-Fixes.jar
          if-no-files-found: error
          retention-days: 14
